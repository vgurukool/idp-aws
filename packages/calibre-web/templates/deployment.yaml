apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "calibre-web.fullname" . }}
  labels:
    {{- include "calibre-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate # Recreate strategy ensures safe single-pod SQLite metadata.db access
  selector:
    matchLabels:
      {{- include "calibre-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "calibre-web.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: init-calibre-db
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              if [ ! -f /books/metadata.db ]; then
                echo "Initializing blank Calibre metadata.db in /books..."
                if [ -f /app/calibre-web/library/metadata.db ]; then
                  cp /app/calibre-web/library/metadata.db /books/metadata.db
                else
                  curl -sSL -o /books/metadata.db https://raw.githubusercontent.com/janeczku/calibre-web/master/library/metadata.db
                fi
                chown -R 1000:1000 /books
                chmod 664 /books/metadata.db
                echo "metadata.db created successfully."
              else
                echo "metadata.db already exists."
              fi

              # Ensure schema compatibility (Calibre 7+ schema 27 compatibility with Calibre-Web)
              if [ -f /books/metadata.db ]; then
                python3 -c "import sqlite3; conn = sqlite3.connect('/books/metadata.db'); c = conn.cursor(); c.execute('PRAGMA table_info(books)'); cols = [r[1] for r in c.fetchall()]; (c.execute('ALTER TABLE books ADD COLUMN isbn TEXT DEFAULT \"\"') if 'isbn' not in cols else None); (c.execute('ALTER TABLE books ADD COLUMN flags INTEGER DEFAULT 1') if 'flags' not in cols else None); conn.commit(); conn.close(); print('metadata.db schema patched successfully!')"
                chown -R 1000:1000 /books
                chmod 664 /books/metadata.db
              fi
          volumeMounts:
            - name: data-volume
              mountPath: /books
              subPath: books
      containers:
        # 1. Calibre-Web Main Container
        - name: calibre-web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: PUID
              value: {{ .Values.env.PUID | quote }}
            - name: PGID
              value: {{ .Values.env.PGID | quote }}
            - name: TZ
              value: {{ .Values.env.TZ | quote }}
            - name: DOCKER_MODS
              value: {{ .Values.env.DOCKER_MODS | quote }}
          volumeMounts:
            - name: data-volume
              mountPath: /config
              subPath: config
            - name: data-volume
              mountPath: /books
              subPath: books
            - name: seed-scripts
              mountPath: /custom-cont-init.d/01-seed-books.sh
              subPath: 01-seed-books.sh
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /
              port: 8083
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 20

        {{- if .Values.sso.enabled }}
        # 2. OAuth2-Proxy Sidecar Container for Keycloak SSO
        - name: oauth2-proxy
          image: "{{ .Values.sso.image.repository }}:{{ .Values.sso.image.tag }}"
          imagePullPolicy: {{ .Values.sso.image.pullPolicy }}
          args:
            - --provider=keycloak-oidc
            - --client-id=$(OAUTH2_PROXY_CLIENT_ID)
            - --client-secret=$(OAUTH2_PROXY_CLIENT_SECRET)
            - --oidc-issuer-url={{ .Values.sso.keycloak.issuerUrl }}
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:8083/
            - --redirect-url=https://{{ (index .Values.ingress.hosts 0).host }}/oauth2/callback
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-domain={{ .Values.sso.cookie.domain }}
            - --cookie-samesite=lax
            - --set-xauthrequest=true
            - --pass-user-headers=true
            - --pass-access-token=true
            - --ssl-insecure-skip-verify=true
            - --oidc-extra-audience=account
            - --insecure-oidc-allow-unverified-email=true
          envFrom:
            - secretRef:
                name: {{ include "calibre-web.fullname" . }}-oauth2-proxy
          ports:
            - name: oauth2-proxy
              containerPort: 4180
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        {{- end }}

      volumes:
        - name: data-volume
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "calibre-web.fullname" . }}-data
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: seed-scripts
          configMap:
            name: {{ include "calibre-web.fullname" . }}-seed-scripts
            defaultMode: 0755
