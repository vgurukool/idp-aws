# Granth (Calibre-Web) Helm Values
replicaCount: 1

image:
  repository: linuxserver/calibre-web
  tag: "0.6.24"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8083

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # Keycloak SSO Authentication via oauth2-proxy
    nginx.ingress.kubernetes.io/auth-url: "https://granth.vgurukool.com/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://granth.vgurukool.com/oauth2/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Preferred-Username"
  hosts:
    - host: granth.vgurukool.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: granth-vgurukool-tls
      hosts:
        - granth.vgurukool.com

# OAuth2-Proxy Sidecar Configuration for Keycloak SSO
sso:
  enabled: true
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: "v7.6.0"
    pullPolicy: IfNotPresent
  port: 4180
  keycloak:
    issuerUrl: "https://platform.vgurukool.com/keycloak/realms/cnoe"
    clientId: "calibre-web"
    clientSecret: "granth-keycloak-sso-secret-2026"
  cookie:
    secret: "Z3JhbnRoLXNlY3JldC1jb29raWUtMjAyNg==" # base64 encoded random seed
    domain: ".vgurukool.com"

persistence:
  enabled: true
  storageClass: "gp3"
  size: 15Gi
  accessMode: ReadWriteOnce

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

env:
  PUID: "1000"
  PGID: "1000"
  TZ: "America/Chicago"
  DOCKER_MODS: "linuxserver/mods:universal-calibre" # Enables calibre converter tools for mobi/epub/pdf
