# Granth Svadhyaya (Lector) Helm Values
replicaCount: 1

image:
  repository: ghcr.io/heuwels/lector
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "256k"
    # Keycloak SSO Authentication via oauth2-proxy
    nginx.ingress.kubernetes.io/auth-url: "https://svadhyaya.vgurukool.com/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://svadhyaya.vgurukool.com/oauth2/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Preferred-Username"
  hosts:
    - host: svadhyaya.vgurukool.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: svadhyaya-vgurukool-tls
      hosts:
        - svadhyaya.vgurukool.com

# OAuth2-Proxy Sidecar Configuration for Keycloak SSO
sso:
  enabled: true
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: "v7.6.0"
    pullPolicy: IfNotPresent
  port: 4180
  keycloak:
    issuerUrl: "https://platform.vgurukool.com/keycloak/realms/cnoe"
    clientId: "lector"
  cookie:
    domain: "svadhyaya.vgurukool.com"

externalSecrets:
  enabled: true


persistence:
  enabled: true
  storageClass: "gp3"
  size: 5Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
