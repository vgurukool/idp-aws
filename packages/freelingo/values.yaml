# Bhasha Vidya (FreeLingo) Helm Values
replicaCount: 1

image:
  repository: ayusing/freelingo
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "256k"
    # Keycloak SSO Authentication via oauth2-proxy
    nginx.ingress.kubernetes.io/auth-url: "https://bhasha.vgurukool.com/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://bhasha.vgurukool.com/oauth2/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Preferred-Username"
  hosts:
    - host: bhasha.vgurukool.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: bhasha-vgurukool-tls
      hosts:
        - bhasha.vgurukool.com

env:
  NODE_ENV: "production"
  NEXTAUTH_URL: "https://bhasha.vgurukool.com"
  PORT: "3000"

database:
  host: "postgres-cluster.postgres.svc.cluster.local"
  port: 5432
  name: "freelingo_db"
  user: "freelingo_user"

# OAuth2-Proxy Sidecar Configuration for Keycloak SSO
sso:
  enabled: true
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: "v7.6.0"
    pullPolicy: IfNotPresent
  port: 4180
  keycloak:
    issuerUrl: "https://platform.vgurukool.com/keycloak/realms/cnoe"
    clientId: "freelingo"
  cookie:
    domain: "bhasha.vgurukool.com"

keycloak:
  issuer: "https://platform.vgurukool.com/keycloak/realms/cnoe"
  clientId: "freelingo"

externalSecrets:
  enabled: true


resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
