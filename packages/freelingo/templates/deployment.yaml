apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freelingo.fullname" . }}
  labels:
    {{- include "freelingo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "freelingo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "freelingo.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | quote }}
            - name: NEXTAUTH_URL
              value: {{ .Values.env.NEXTAUTH_URL | quote }}
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: BACKEND_URL
              value: "http://127.0.0.1:8000"
          envFrom:
            - secretRef:
                name: {{ include "freelingo.fullname" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

        {{- if .Values.redis.enabled }}
        # Redis Container for FreeLingo Token Storage & Rate Limiting
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          ports:
            - name: redis
              containerPort: {{ .Values.redis.port | default 6379 }}
              protocol: TCP
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
        {{- end }}

        {{- if .Values.backend.enabled }}
        # FreeLingo FastAPI Backend Container
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command:
            - sh
            - -c
            - "cd /tmp && PYTHONPATH=/app alembic -c /app/alembic.ini upgrade head && cd /app && uvicorn app.main:app --host 0.0.0.0 --port 8000"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "freelingo.fullname" . }}
                  key: DATABASE_URL_ASYNC
            - name: REDIS_URL
              value: "redis://127.0.0.1:6379/0"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "freelingo.fullname" . }}
                  key: SECRET_KEY
            - name: ALLOW_REGISTRATION
              value: "true"
            - name: FIRST_USER_IS_ADMIN
              value: "true"
            - name: CORS_ORIGINS
              value: '["https://bhasha.vgurukool.com", "http://localhost:3000"]'
            - name: APP_BASE_URL
              value: "https://bhasha.vgurukool.com"
          ports:
            - name: backend
              containerPort: {{ .Values.backend.port | default 8000 }}
              protocol: TCP
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/config
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
        {{- end }}

        {{- if .Values.sso.enabled }}
        # OAuth2-Proxy Sidecar Container for Keycloak SSO
        - name: oauth2-proxy
          image: "{{ .Values.sso.image.repository }}:{{ .Values.sso.image.tag }}"
          imagePullPolicy: {{ .Values.sso.image.pullPolicy }}
          args:
            - --provider=keycloak-oidc
            - --client-id=$(OAUTH2_PROXY_CLIENT_ID)
            - --client-secret=$(OAUTH2_PROXY_CLIENT_SECRET)
            - --oidc-issuer-url={{ .Values.sso.keycloak.issuerUrl }}
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:3000/
            - --redirect-url=https://{{ (index .Values.ingress.hosts 0).host }}/oauth2/callback
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-domain={{ .Values.sso.cookie.domain }}
            - --cookie-samesite=lax
            - --set-xauthrequest=true
            - --pass-user-headers=true
            - --pass-access-token=true
            - --ssl-insecure-skip-verify=true
            - --oidc-extra-audience=account
            - --insecure-oidc-allow-unverified-email=true
          envFrom:
            - secretRef:
                name: {{ include "freelingo.fullname" . }}-oauth2-proxy
          ports:
            - name: oauth2-proxy
              containerPort: 4180
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        {{- end }}
