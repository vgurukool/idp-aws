apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freelingo.fullname" . }}
  labels:
    {{- include "freelingo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "freelingo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "freelingo.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.env.NODE_ENV | quote }}
            - name: NEXTAUTH_URL
              value: {{ .Values.env.NEXTAUTH_URL | quote }}
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
          envFrom:
            - secretRef:
                name: {{ include "freelingo.fullname" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

        {{- if .Values.sso.enabled }}
        # OAuth2-Proxy Sidecar Container for Keycloak SSO
        - name: oauth2-proxy
          image: "{{ .Values.sso.image.repository }}:{{ .Values.sso.image.tag }}"
          imagePullPolicy: {{ .Values.sso.image.pullPolicy }}
          args:
            - --provider=keycloak-oidc
            - --client-id=$(OAUTH2_PROXY_CLIENT_ID)
            - --client-secret=$(OAUTH2_PROXY_CLIENT_SECRET)
            - --oidc-issuer-url={{ .Values.sso.keycloak.issuerUrl }}
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:3000/
            - --redirect-url=https://{{ (index .Values.ingress.hosts 0).host }}/oauth2/callback
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-domain={{ .Values.sso.cookie.domain }}
            - --cookie-samesite=lax
            - --set-xauthrequest=true
            - --pass-user-headers=true
            - --pass-access-token=true
            - --ssl-insecure-skip-verify=true
            - --oidc-extra-audience=account
            - --insecure-oidc-allow-unverified-email=true
          envFrom:
            - secretRef:
                name: {{ include "freelingo.fullname" . }}-oauth2-proxy
          ports:
            - name: oauth2-proxy
              containerPort: 4180
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        {{- end }}
