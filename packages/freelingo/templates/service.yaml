apiVersion: v1
kind: Service
metadata:
  name: {{ include "freelingo.fullname" . }}
  labels:
    {{- include "freelingo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 3000
      protocol: TCP
  selector:
    {{- include "freelingo.selectorLabels" . | nindent 4 }}
