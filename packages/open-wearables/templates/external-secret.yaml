{{- if .Values.externalSecrets.enabled -}}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "open-wearables.fullname" . }}-db-pass
  labels:
    {{- include "open-wearables.labels" . | nindent 4 }}
spec:
  length: 32
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "open-wearables.fullname" . }}-secret-key
  labels:
    {{- include "open-wearables.labels" . | nindent 4 }}
spec:
  length: 64
  digits: 20
  symbols: 0
  noUpper: false
  allowRepeat: true
{{- if .Values.sso.enabled }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "open-wearables.fullname" . }}-cookie-secret
  labels:
    {{- include "open-wearables.labels" . | nindent 4 }}
spec:
  length: 32
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
{{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "open-wearables.fullname" . }}-secret
  labels:
    {{- include "open-wearables.labels" . | nindent 4 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStore | default "aws-secretsmanager" }}
    kind: ClusterSecretStore
  target:
    name: {{ include "open-wearables.fullname" . }}-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_PASSWORD: "{{ `{{ .dbPassword }}` }}"
        SECRET_KEY: "{{ `{{ .secretKey }}` }}"
        {{- if .Values.sso.enabled }}
        OAUTH2_PROXY_CLIENT_ID: {{ .Values.sso.keycloak.clientId | quote }}
        OAUTH2_PROXY_COOKIE_SECRET: "{{ `{{ .cookieSecret }}` }}"
        {{- if .Values.externalSecrets.remoteSecrets.clientSecretKey }}
        OAUTH2_PROXY_CLIENT_SECRET: "{{ `{{ .clientSecret }}` }}"
        {{- else }}
        OAUTH2_PROXY_CLIENT_SECRET: "{{ `{{ .generatedClientSecret }}` }}"
        {{- end }}
        {{- end }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "open-wearables.fullname" . }}-db-pass
      rewrite:
        - regexp:
            source: "(.*)"
            target: "dbPassword"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "open-wearables.fullname" . }}-secret-key
      rewrite:
        - regexp:
            source: "(.*)"
            target: "secretKey"
    {{- if .Values.sso.enabled }}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "open-wearables.fullname" . }}-cookie-secret
      rewrite:
        - regexp:
            source: "(.*)"
            target: "cookieSecret"
    {{- if not .Values.externalSecrets.remoteSecrets.clientSecretKey }}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "open-wearables.fullname" . }}-cookie-secret
      rewrite:
        - regexp:
            source: "(.*)"
            target: "generatedClientSecret"
    {{- end }}
    {{- end }}
{{- end }}
