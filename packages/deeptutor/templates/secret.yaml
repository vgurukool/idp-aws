{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deeptutor.fullname" . }}
  labels:
    {{- include "deeptutor.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_BASE: {{ .Values.llm.apiBase | quote }}
  OPENAI_API_KEY: {{ .Values.llm.apiKey | default "" | quote }}
  DEFAULT_MODEL: {{ .Values.llm.model | quote }}
---
{{- if .Values.sso.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deeptutor.fullname" . }}-oauth2-proxy
  labels:
    {{- include "deeptutor.labels" . | nindent 4 }}
type: Opaque
stringData:
  OAUTH2_PROXY_CLIENT_ID: {{ .Values.sso.keycloak.clientId | quote }}
  OAUTH2_PROXY_CLIENT_SECRET: {{ .Values.sso.keycloak.clientSecret | default "" | quote }}
  OAUTH2_PROXY_COOKIE_SECRET: {{ .Values.sso.cookie.secret | default "" | quote }}
{{- end }}
{{- end }}

