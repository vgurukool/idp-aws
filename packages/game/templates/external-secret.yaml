{{- if .Values.externalSecrets.enabled }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "game.fullname" . }}-pwd-gen
  labels:
    {{- include "game.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "game.fullname" . }}
  labels:
    {{- include "game.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ include "game.fullname" . }}
    template:
      data:
        DATABASE_URL: "postgresql://{{ .Values.database.user }}:{{ `{{ .dbPassword }}` }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
        DB_PASSWORD: "{{ `{{ .dbPassword }}` }}"
        SECRET_KEY: "{{ `{{ .jwtSecret }}` }}"
        KEYCLOAK_CLIENT_ID: {{ .Values.keycloak.clientId | quote }}
        KEYCLOAK_CLIENT_SECRET: "{{ `{{ .clientSecret }}` }}"
        KEYCLOAK_ISSUER: {{ .Values.keycloak.issuer | quote }}
        KEYCLOAK_URL: {{ .Values.keycloak.url | quote }}
        KEYCLOAK_REALM: {{ .Values.keycloak.realm | quote }}
        KEYCLOAK_AUDIENCE: {{ .Values.keycloak.audience | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "game.fullname" . }}-pwd-gen
      rewrite:
        - transform:
            template: "jwtSecret"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "game.fullname" . }}-pwd-gen
      rewrite:
        - transform:
            template: "clientSecret"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "game.fullname" . }}-pwd-gen
      rewrite:
        - transform:
            template: "dbPassword"
{{- end }}
