apiVersion: v1
kind: Service
metadata:
  name: {{ include "game.fullname" . }}-api
  labels:
    {{- include "game.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: 8080
      protocol: TCP
  selector:
    {{- include "game.apiSelectorLabels" . | nindent 4 }}
