apiVersion: v1
kind: Service
metadata:
  name: {{ include "game.fullname" . }}-dashboard
  labels:
    {{- include "game.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: 3000
      protocol: TCP
  selector:
    {{- include "game.dashboardSelectorLabels" . | nindent 4 }}
