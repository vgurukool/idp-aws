# Karma Vijaya (GAME) Helm Values
replicaCount: 1

image:
  repository: ghcr.io/fvergaracl/game
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "256k"
  hosts:
    - host: karma.vgurukool.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: karma-vgurukool-tls
      hosts:
        - karma.vgurukool.com

env:
  ENVIRONMENT: "production"
  PORT: "8080"
  APP_URL: "https://karma.vgurukool.com"

database:
  host: "postgres-cluster.postgres.svc.cluster.local"
  port: 5432
  name: "game_db"
  user: "game_user"

keycloak:
  issuer: "https://platform.vgurukool.com/keycloak/realms/cnoe"
  clientId: "game"

externalSecrets:
  enabled: true


resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
