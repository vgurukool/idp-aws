apiVersion: v1
kind: ConfigMap
metadata:
  name: vgurukool-theme
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "20"
data:
  theme.properties: |
    parent=keycloak
    import=common/keycloak

    styles=css/vgurukool.css
    locales=en

  template.ftl: |
    <#macro registrationLayout displayInfo=false displayMessage=true displayRequiredFields=false showAnotherWayIfPresent=true>
    <!DOCTYPE html>
    <html lang="${(locale.currentLanguageTag)!'en'}" class="h-full">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="robots" content="noindex, nofollow">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>${msg("loginTitle", ((realm.displayName)!'Vgurukool Sovereign Identity'))}</title>
        <link rel="icon" href="${url.resourcesPath}/img/favicon.ico" />
        
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

        <#if properties.styles?has_content>
            <#list properties.styles?split(' ') as style>
                <link href="${url.resourcesPath}/${style}" rel="stylesheet" />
            </#list>
        </#if>

        <style>
    /* ==========================================================================
       Vgurukool Sovereign Identity — Keycloak SSO Theme Stylesheet
       ========================================================================== */

    :root {
      --vg-bg-deep: #020617;
      --vg-card-bg: rgba(15, 23, 42, 0.82);
      --vg-card-border: rgba(245, 158, 11, 0.24);
      --vg-gold-primary: #F59E0B;
      --vg-gold-light: #FDE68A;
      --vg-orange-primary: #EA580C;
      --vg-text-main: #F8FAFC;
      --vg-text-muted: #94A3B8;
      --vg-input-bg: rgba(2, 6, 23, 0.88);
      --vg-input-border: rgba(51, 65, 85, 0.8);
      --vg-input-focus: #F59E0B;
      --vg-error: #EF4444;
      --vg-font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --vg-font-cinzel: 'Cinzel', serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body.vgurukool-body {
      font-family: var(--vg-font-sans);
      background-color: var(--vg-bg-deep);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.16), transparent 45%),
        radial-gradient(circle at 100% 100%, rgba(234, 88, 12, 0.08), transparent 35%),
        radial-gradient(circle at 0% 100%, rgba(217, 119, 6, 0.08), transparent 35%);
      color: var(--vg-text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* --------------------------------------------------------------------------
       Top Status Bar
       -------------------------------------------------------------------------- */
    .vg-top-bar {
      width: 100%;
      max-width: 1200px;
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0.85;
      font-size: 0.75rem;
    }

    .vg-top-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(245, 158, 11, 0.85);
    }

    .vg-pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--vg-gold-primary);
      box-shadow: 0 0 10px var(--vg-gold-primary);
      animation: vgPulse 2s infinite;
    }

    @keyframes vgPulse {
      0% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
      100% { opacity: 0.4; transform: scale(0.9); }
    }

    .vg-top-right {
      color: var(--vg-text-muted);
    }

    .vg-realm-badge {
      color: var(--vg-gold-primary);
      font-family: monospace;
      font-weight: 700;
    }

    /* --------------------------------------------------------------------------
       Main Login Card Container
       -------------------------------------------------------------------------- */
    .vg-main-container {
      width: 100%;
      max-width: 440px;
      margin: auto 0;
      padding: 1rem 0;
    }


    .vg-logo-wrapper {
      display: inline-flex;
      padding: 3px;
      border-radius: 20px;
      background: linear-gradient(135deg, #F59E0B, #EA580C, #FBBF24);
      box-shadow: 0 10px 25px -5px rgba(234, 88, 12, 0.35);
      margin-bottom: 1rem;
      transition: transform 0.3s ease;
    }

    .vg-logo-wrapper:hover {
      transform: scale(1.06);
    }

    .vg-logo-inner {
      width: 64px;
      height: 64px;
      background-color: #020617;
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .vg-logo-mark {
      width: 100%;
      height: 100%;
    }

    /* Brand Header */
    .vg-brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .vg-om-wrapper {
      display: inline-flex;
      padding: 4px;
      border-radius: 16px;
      background: linear-gradient(135deg, #F59E0B, #EA580C, #FBBF24);
      box-shadow: 0 10px 25px -5px rgba(234, 88, 12, 0.35);
      margin-bottom: 1rem;
      transition: transform 0.3s ease;
    }

    .vg-om-wrapper:hover {
      transform: scale(1.06);
    }

    .vg-om-inner {
      width: 56px;
      height: 56px;
      background-color: #020617;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vg-om-symbol {
      font-size: 2rem;
      color: var(--vg-gold-primary);
      font-weight: bold;
      user-select: none;
      line-height: 1;
    }

    .vg-brand-title {
      font-size: 1.75rem;
      font-weight: 900;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      letter-spacing: -0.02em;
    }

    .vg-brand-name {
      font-family: var(--vg-font-cinzel);
      letter-spacing: 0.08em;
    }

    .vg-sso-badge {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--vg-gold-primary);
      border: 1px solid rgba(245, 158, 11, 0.35);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      vertical-align: middle;
    }

    .vg-brand-tagline {
      font-size: 0.75rem;
      color: var(--vg-text-muted);
      margin-top: 0.35rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* Glass Card */
    .vg-card {
      background: var(--vg-card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--vg-card-border);
      border-radius: 24px;
      padding: 2rem 2.25rem;
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.85),
        0 0 35px rgba(245, 158, 11, 0.08);
    }

    .vg-card-header {
      margin-bottom: 1.5rem;
    }

    .vg-page-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: -0.01em;
    }

    .vg-card-subtitle {
      font-size: 0.75rem;
      color: var(--vg-text-muted);
      margin-top: 0.25rem;
    }

    /* --------------------------------------------------------------------------
       Alerts & Notifications
       -------------------------------------------------------------------------- */
    .vg-alert {
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .vg-alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #FCA5A5;
    }

    .vg-alert-warning {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #FDE68A;
    }

    .vg-alert-success {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6EE7B7;
    }

    .vg-alert-info {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #BAE6FD;
    }

    .vg-alert-icon {
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* --------------------------------------------------------------------------
       Forms & Controls
       -------------------------------------------------------------------------- */
    .vg-login-form {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .vg-form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .vg-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .vg-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #CBD5E1;
    }

    .vg-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .vg-field-icon {
      position: absolute;
      left: 0.85rem;
      width: 18px;
      height: 18px;
      color: #64748B;
      pointer-events: none;
    }

    .vg-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      background-color: var(--vg-input-bg);
      border: 1px solid var(--vg-input-border);
      border-radius: 12px;
      color: #FFFFFF;
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .vg-input::placeholder {
      color: #475569;
    }

    .vg-input:focus {
      border-color: var(--vg-input-focus);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.22);
    }

    .vg-toggle-pwd {
      position: absolute;
      right: 0.85rem;
      background: transparent;
      border: none;
      color: #64748B;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
    }

    .vg-toggle-pwd:hover {
      color: #CBD5E1;
    }

    .vg-eye-icon {
      width: 18px;
      height: 18px;
    }

    .vg-field-error {
      font-size: 0.7rem;
      color: var(--vg-error);
      margin-top: 0.25rem;
    }

    .vg-link-forgot {
      font-size: 0.75rem;
      color: var(--vg-gold-primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    .vg-link-forgot:hover {
      color: var(--vg-gold-light);
      text-decoration: underline;
    }

    /* Checkbox */
    .vg-checkbox-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding-top: 0.25rem;
    }

    .vg-checkbox {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      accent-color: var(--vg-gold-primary);
      cursor: pointer;
    }

    .vg-checkbox-label {
      font-size: 0.75rem;
      color: #CBD5E1;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }

    /* Primary Submit Button */
    .vg-btn-row {
      padding-top: 0.5rem;
    }

    .vg-btn-primary {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      border: none;
      font-size: 0.875rem;
      font-weight: 800;
      font-family: inherit;
      letter-spacing: 0.02em;
      color: #020617;
      background: linear-gradient(135deg, #F59E0B 0%, #EA580C 100%);
      box-shadow: 0 10px 25px -5px rgba(234, 88, 12, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .vg-btn-primary:hover {
      background: linear-gradient(135deg, #FBBF24 0%, #F97316 100%);
      box-shadow: 0 12px 30px -5px rgba(234, 88, 12, 0.45);
      transform: translateY(-1px);
    }

    .vg-btn-primary:active {
      transform: translateY(0);
    }

    .vg-btn-arrow {
      width: 16px;
      height: 16px;
    }

    /* Registration Section */
    .vg-register-section {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(51, 65, 85, 0.6);
      text-align: center;
      font-size: 0.75rem;
      color: var(--vg-text-muted);
    }

    .vg-register-link {
      color: var(--vg-gold-primary);
      font-weight: 700;
      text-decoration: none;
      margin-left: 0.3rem;
      transition: color 0.15s ease;
    }

    .vg-register-link:hover {
      color: var(--vg-gold-light);
      text-decoration: underline;
    }

    /* --------------------------------------------------------------------------
       Ecosystem Apps Strip & Footer
       -------------------------------------------------------------------------- */
    .vg-apps-strip {
      margin-top: 1.75rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.5rem 0.6rem;
      font-size: 0.7rem;
      color: #64748B;
    }

    .vg-app-pill {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .vg-pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .dot-emerald { background-color: #10B981; }
    .dot-amber   { background-color: #F59E0B; }
    .dot-indigo  { background-color: #6366F1; }
    .dot-sky     { background-color: #38BDF8; }

    .vg-dot-sep {
      opacity: 0.4;
    }

    .vg-footer {
      width: 100%;
      max-width: 1200px;
      padding: 1rem;
      text-align: center;
      font-size: 0.75rem;
      color: #64748B;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .vg-card {
        padding: 1.75rem 1.5rem;
        border-radius: 20px;
      }
      .vg-brand-title {
        font-size: 1.5rem;
      }
    }

        </style>
    </head>

    <body class="vgurukool-body">
        <!-- Top System Banner -->
        <header class="vg-top-bar">
            <div class="vg-top-left">
                <span class="vg-pulse-dot"></span>
                <span>CNOE Sovereign Identity Hub</span>
            </div>
            <div class="vg-top-right">
                Realm: <span class="vg-realm-badge">${(realm.name)!'cnoe'}</span>
            </div>
        </header>

        <!-- Center Content -->
        <main class="vg-main-container">
            <!-- Brand Header -->
            <div class="vg-brand-header">
                            <div class="vg-logo-wrapper">
                    <div class="vg-logo-inner">
                        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="vg-logo-mark">
                            <defs>
                                <linearGradient id="kcLogoGold" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#FDE68A" />
                                    <stop offset="50%" stop-color="#F59E0B" />
                                    <stop offset="100%" stop-color="#EA580C" />
                                </linearGradient>
                                <linearGradient id="kcLogoFlame" x1="0%" y1="100%" x2="0%" y2="0%">
                                    <stop offset="0%" stop-color="#EA580C" />
                                    <stop offset="50%" stop-color="#F59E0B" />
                                    <stop offset="100%" stop-color="#FEF08A" />
                                </linearGradient>
                            </defs>
                            <!-- Lotus Petals Halo -->
                            <g stroke="url(#kcLogoGold)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
                                <path d="M50 10 C54 20 54 28 50 36 C46 28 46 20 50 10 Z" fill="url(#kcLogoGold)" fill-opacity="0.25" />
                                <path d="M42 16 C39 25 43 33 48 37 C43 32 39 26 42 16 Z" fill="url(#kcLogoGold)" fill-opacity="0.2" />
                                <path d="M58 16 C61 25 57 33 52 37 C57 32 61 26 58 16 Z" fill="url(#kcLogoGold)" fill-opacity="0.2" />
                                <path d="M33 24 C29 32 34 40 42 42 C35 38 31 33 33 24 Z" fill="url(#kcLogoGold)" fill-opacity="0.15" />
                                <path d="M67 24 C71 32 66 40 58 42 C65 38 69 33 67 24 Z" fill="url(#kcLogoGold)" fill-opacity="0.15" />
                                <path d="M25 35 C22 43 28 49 38 48 C30 46 25 41 25 35 Z" fill="url(#kcLogoGold)" fill-opacity="0.12" />
                                <path d="M75 35 C78 43 72 49 62 48 C70 46 75 41 75 35 Z" fill="url(#kcLogoGold)" fill-opacity="0.12" />
                            </g>
                            <!-- Ascending Flame Core -->
                            <path d="M50 24 C55 34 57 44 52 53 C49 58 44 54 48 48 C51 42 47 36 50 24 Z" fill="url(#kcLogoFlame)" />
                            <path d="M48 38 C45 45 47 52 50 56 C47 54 44 48 48 38 Z" fill="#FEF08A" />
                            <!-- Geometric 'V' Pedestal -->
                            <g fill="url(#kcLogoGold)">
                                <path d="M32 46 L47 76 L50 82 L53 76 L68 46 L60 46 L50 67 L40 46 Z" />
                                <path d="M26 46 L47 87 L50 94 L53 87 L74 46 L68 46 L50 82 L32 46 Z" fill-opacity="0.65" />
                            </g>
                        </svg>
                    </div>
                </div>
                <h1 class="vg-brand-title">
                    <span class="vg-brand-name">VGURUKOOL</span>
                    <span class="vg-sso-badge">SSO</span>
                </h1>
                <p class="vg-brand-tagline">Ancient Wisdom &bull; Modern Sovereign Intelligence</p>
            </div>

            <!-- Glassmorphism Card -->
            <div class="vg-card">
                <div class="vg-card-header">
                    <h2 class="vg-page-title"><#nested "header"></h2>
                    <#if displayInfo>
                        <p class="vg-card-subtitle"><#nested "info"></p>
                    </#if>
                </div>

                <!-- Global Feedback Message -->
                <#if displayMessage && (message)?has_content && ((message.type)!'') != 'warning'>
                    <div class="vg-alert vg-alert-${message.type}">
                        <#if message.type = 'success'><span class="vg-alert-icon">&check;</span></#if>
                        <#if message.type = 'warning'><span class="vg-alert-icon">&excl;</span></#if>
                        <#if message.type = 'error'><span class="vg-alert-icon">&times;</span></#if>
                        <#if message.type = 'info'><span class="vg-alert-icon">&quest;</span></#if>
                        <span class="vg-alert-text">${kcSanitize(message.summary)?no_esc}</span>
                    </div>
                </#if>

                <!-- Main Form Injection -->
                <div class="vg-form-wrapper">
                    <#nested "form">
                </div>

                <!-- Social / Identity Providers Injection -->
                <#if (realm.password)!false && (social.providers)??>
                    <div class="vg-social-section">
                        <#nested "socialProviders">
                    </div>
                </#if>
            </div>

            <!-- Supported Ecosystem Apps Indicator -->
            <div class="vg-apps-strip">
                <span class="vg-app-pill"><span class="vg-pill-dot dot-emerald"></span>Learnhouse LMS</span>
                <span class="vg-dot-sep">&bull;</span>
                <span class="vg-app-pill"><span class="vg-pill-dot dot-amber"></span>Ashta Lakshmi</span>
                <span class="vg-dot-sep">&bull;</span>
                <span class="vg-app-pill"><span class="vg-pill-dot dot-indigo"></span>CAIPE AI Hub</span>
                <span class="vg-dot-sep">&bull;</span>
                <span class="vg-app-pill"><span class="vg-pill-dot dot-sky"></span>Granth Library</span>
            </div>
        </main>

        <!-- Footer -->
        <footer class="vg-footer">
            <p>Protected by Keycloak OIDC &bull; Sovereign Vedic Learning &amp; Abundance Architecture</p>
        </footer>
    </body>
    </html>
    </#macro>

  login.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=!((messagesPerField.existsError('username','password'))!false) displayInfo=((realm.password)!false && (realm.registrationAllowed)!false && !registrationDisabled??); section>
        <#if section = "header">
            ${msg("loginAccountTitle")}
        <#elseif section = "form">
            <div id="kc-form">
                <div id="kc-form-wrapper">
                    <#if (realm.password)!false>
                        <form id="kc-form-login" onsubmit="login.disabled = true; return true;" action="${url.loginAction}" method="post" class="vg-login-form">
                            <#if !usernameEditDisabled??>
                                <div class="vg-form-group">
                                    <label for="username" class="vg-label">
                                        <#if !(realm.loginWithEmailAllowed)!false>${msg("username")}<#elseif !(realm.registrationEmailAsUsername)!false>${msg("usernameOrEmail")}<#else>${msg("email")}</#if>
                                    </label>
                                    <div class="vg-input-wrapper">
                                        <svg class="vg-field-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                        </svg>
                                        <input tabindex="1" id="username" class="vg-input" name="username" value="${(login.username!'')}" type="text" autofocus autocomplete="username"
                                               placeholder="e.g. adira@vgurukool.com"
                                               aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>" />
                                    </div>
                                    <#if messagesPerField.existsError('username','password')>
                                        <span class="vg-field-error" aria-live="polite">
                                            ${kcSanitize(messagesPerField.getFirstError('username','password'))?no_esc}
                                        </span>
                                    </#if>
                                </div>
                            </#if>

                            <div class="vg-form-group">
                                <div class="vg-label-row">
                                    <label for="password" class="vg-label">${msg("password")}</label>
                                    <#if (realm.resetPasswordAllowed)!false>
                                        <a tabindex="5" href="${url.loginResetCredentialsUrl}" class="vg-link-forgot">${msg("doForgotPassword")}</a>
                                    </#if>
                                </div>
                                <div class="vg-input-wrapper">
                                    <svg class="vg-field-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                    </svg>
                                    <input tabindex="2" id="password" class="vg-input" name="password" type="password" autocomplete="current-password"
                                           placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
                                           aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>" />
                                    <button type="button" class="vg-toggle-pwd" onclick="var p=document.getElementById('password'); p.type = p.type==='password'?'text':'password';" title="Toggle Password Visibility">
                                        <svg class="vg-eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <#if (realm.rememberMe)!false && !usernameEditDisabled??>
                                <div class="vg-checkbox-row">
                                    <input tabindex="3" id="rememberMe" name="rememberMe" type="checkbox" class="vg-checkbox" <#if login.rememberMe??>checked</#if>>
                                    <label for="rememberMe" class="vg-checkbox-label">${msg("rememberMe")}</label>
                                </div>
                            </#if>

                            <div class="vg-btn-row">
                                <input type="hidden" id="id-hidden-input" name="credentialId" <#if (auth.selectedCredential)?has_content>value="${auth.selectedCredential}"</#if>/>
                                <button tabindex="4" class="vg-btn-primary" name="login" id="kc-login" type="submit">
                                    <span>Sign In to Vgurukool</span>
                                    <svg class="vg-btn-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                                    </svg>
                                </button>
                            </div>
                        </form>
                    </#if>
                </div>
            </div>
        <#elseif section = "info">
            <#if (realm.password)!false && (realm.registrationAllowed)!false && !registrationDisabled??>
                <div id="kc-registration-container" class="vg-register-section">
                    <span class="vg-register-text">${msg("noAccount")}</span>
                    <a tabindex="6" href="${url.registrationUrl}" class="vg-register-link">${msg("doRegister")}</a>
                </div>
            </#if>
        </#if>
    </@layout.registrationLayout>
