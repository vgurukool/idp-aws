# Default values for unified postgres cluster.
replicaCount: 1

image:
  repository: postgres
  tag: "16.2-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5432
  name: postgres-cluster

auth:
  database: "postgres"
  # Secure credentials management:
  # When useExternalSecrets is true, all tenant database passwords and admin password
  # are dynamically generated via External Secrets Operator (ESO) inside the cluster.
  # Zero credentials reside in Git repository.
  useExternalSecrets: true
  existingSecret: ""

persistence:
  enabled: true
  storageClass: "gp3"
  size: 25Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1536Mi

securityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999

nodeSelector: {}
tolerations: []
affinity: {}
