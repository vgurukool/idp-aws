---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "postgres.fullname" . }}-secret
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ include "postgres.fullname" . }}-secret
    template:
      data:
        POSTGRES_PASSWORD: "{{ `{{ .postgresAdminPassword }}` }}"
        KEYCLOAK_DB_PASSWORD: "{{ `{{ .postgresKeycloakPassword }}` }}"
        LEARNHOUSE_DB_PASSWORD: "{{ `{{ .postgresLearnhousePassword }}` }}"
        LITELLM_DB_PASSWORD: "{{ `{{ .postgresLitellmPassword }}` }}"
        BACKSTAGE_DB_PASSWORD: "{{ `{{ .postgresBackstagePassword }}` }}"
        FREELINGO_DB_PASSWORD: "{{ `{{ .postgresFreelingoPassword }}` }}"
        GAME_DB_PASSWORD: "{{ `{{ .postgresGamePassword }}` }}"
        ASHTA_DB_PASSWORD: "{{ `{{ .postgresAshtaPassword }}` }}"
        OPENFGA_DB_PASSWORD: "{{ `{{ .postgresOpenfgaPassword }}` }}"
        OPENWEARABLES_DB_PASSWORD: "{{ `{{ .postgresOpenwearablesPassword }}` }}"
        MAIC_DB_PASSWORD: "{{ `{{ .postgresMaicPassword }}` }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "postgres.fullname" . }}-admin-pwd
      rewrite:
        - transform:
            template: "postgresAdminPassword"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "postgres.fullname" . }}-keycloak-pwd
      rewrite:
        - transform:
            template: "postgresKeycloakPassword"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "postgres.fullname" . }}-learnhouse-pwd
      rewrite:
        - transform:
            template: "postgresLearnhousePassword"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "postgres.fullname" . }}-litellm-pwd
      rewrite:
        - transform:
            template: "postgresLitellmPassword"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "postgres.fullname" . }}-backstage-pwd
      rewrite:
        - transform:
            template: "postgresBackstagePassword"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "postgres.fullname" . }}-freelingo-pwd
      rewrite:
        - transform:
            template: "postgresFreelingoPassword"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "postgres.fullname" . }}-game-pwd
      rewrite:
        - transform:
            template: "postgresGamePassword"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "postgres.fullname" . }}-ashta-pwd
      rewrite:
        - transform:
            template: "postgresAshtaPassword"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "postgres.fullname" . }}-openfga-pwd
      rewrite:
        - transform:
            template: "postgresOpenfgaPassword"
    - sourceRef:
