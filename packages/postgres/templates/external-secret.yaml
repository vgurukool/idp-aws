  labels:
    {{- include "postgres.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  length: 32
  digits: 6
  symbols: 4
  symbolCharacters: "-+"
  noUpper: false
  allowRepeat: true
